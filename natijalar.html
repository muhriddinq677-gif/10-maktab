</style></head><body><nav class="nav"><a href="index.html" aria-label="Bosh sahifa">🏠</a><b>🏫 10-maktab</b><a href="index.html">← Asosiy</a></nav><main class="wrap"><header class="hero"><h1>🏆 Natijalarim</h1><p>Yechilgan testlaringiz va to‘plagan ballaringiz.</p></header><div class="toolbar"><input id="search" type="search" placeholder="🔎 Test nomini qidirish..."><select id="filter"><option value="all">📊 Barcha natijalar</option><option value="good">✅ 60% va undan yuqori</option><option value="low">📖 60% dan past</option></select></div><div id="summary" class="card" style="margin-bottom:17px"></div><div id="cards" class="cards"></div><p class="muted">Natijalar hozircha shu brauzerda saqlanadi. Boshqa qurilmalardagi natijalarni birlashtirish uchun umumiy baza kerak.</p></main><footer class="foot">© 2026 • 10-maktab 🎓</footer><script>const $=id=>document.getElementById(id);let user;try{user=JSON.parse(localStorage.getItem('maktabUser'))}catch{}if(!user?.registered)location.replace('login.html');function read(k){try{let x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:[]}catch{return []}}function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n}function date(s){if(!s)return 'Sana yo‘q';let d=new Date(s);return isNaN(d)?'Sana yo‘q':d.toLocaleString('uz-UZ')}const fullName=[user?.ism||user?.firstName,user?.familiya||user?.lastName].filter(Boolean).join(' ');const results=read('maktabTestResults'),tests=read('maktabTests');function render(){let q=$('search').value.toLowerCase(),filter=$('filter').value;let rows=results.slice().reverse().filter(r=>(r.title||'').toLowerCase().includes(q)&&(!r.student||r.student===fullName)&&(!r.sinf||r.sinf===(user.sinf||user.className||''))).filter(r=>filter==='all'||(filter==='good'?r.score/r.total>=.6:r.score/r.total<.6));let box=$('cards');box.replaceChildren();$('summary').textContent='🏆 Natijalar soni: '+rows.length+(rows.length?' • O‘rtacha: '+Math.round(rows.reduce((a,r)=>a+(r.total?r.score/r.total:0),0)/rows.length*100)+'%':'');if(!rows.length){box.append(el('div','empty','📭 Hozircha natija yo‘q. Test yechganingizdan keyin shu yerda chiqadi.'));return}rows.forEach(r=>{let c=el('article','card');c.append(el('span','pill','📚 '+(r.subject||'Test')),el('h2','',r.title||'Nomsiz test'),el('div','score',(r.score||0)+' / '+(r.total||0)),el('p','muted',(r.total?Math.round(r.score/r.total*100):0)+'% to‘g‘ri • 📅 '+date(r.date)));let t=tests.find(x=>x.id===r.testId);if(t&&Array.isArray(r.answers)){let btn=el('button','secondary','👁 Javoblarni ko‘rish'),detail=el('div','detail');detail.hidden=true;t.questions.forEach((question,i)=>{let p=el('p',r.answers[i]===Number(question.correct??question.answer)?'good':'bad',(i+1)+'. '+(question.text||question.question)+' — Sizning javobingiz: '+(question.options?.[r.answers[i]]??'Belgilanmagan')+'; To‘g‘ri: '+(question.options?.[Number(question.correct??question.answer)]??'—'));detail.append(p)});btn.onclick=()=>{detail.hidden=!detail.hidden};c.append(btn,detail)}box.append(c)})}$('search').oninput=$('filter').onchange=render;render();</script></body></html>
